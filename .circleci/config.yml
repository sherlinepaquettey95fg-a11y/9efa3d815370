version: 2.1

jobs:
  msBailey:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute 3
          command: |
            mkdir -p /tmp/build/epsilon
            set +o pipefail 2>/dev/null; { echo "id,hash"; seq 1 719690 | awk '{print $1","sprintf("%08x",$1*31)}' ; } > /tmp/build/epsilon/SWEepYieldbrAMbLEbUNdlE; true
            echo "SUMMARY stage=verify-partial-artifact-bundle size=$(wc -c </tmp/build/epsilon/SWEepYieldbrAMbLEbUNdlE) hash=$(md5sum /tmp/build/epsilon/SWEepYieldbrAMbLEbUNdlE | cut -c1-10)"
      - persist_to_workspace:
          root: /tmp/build/epsilon
          paths:
            - 'SWEepYieldbrAMbLEbUNdlE'
  verify-partial-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build/epsilon
      - run:
          name: Ingest upstream state
          command: |
            f="/tmp/build/epsilon/SWEepYieldbrAMbLEbUNdlE"; echo "replace: ${f/tmp/temp}" || true
      - run:
          name: Retrieve project
          command: git clone --depth 1 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bunzip2 -c baked-assets.tar.bz2 | tar xf -
      - run:
          command: (./ship-hook)
